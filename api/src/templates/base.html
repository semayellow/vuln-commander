<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Vuln Commander{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/lunaris.css?v=8" />
  {% block head_extra %}{% endblock %}
</head>
<body class="lunaris-app">
  <div class="app-shell">
    {% include "partials/sidebar.html" %}
    <div class="main-area">
      <div class="main-content">
        <div class="honeycomb-layer" aria-hidden="true"></div>
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <script src="/static/js/app.js?v=5" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
