<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Vuln Commander</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}" />
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <p class="login-eyebrow">Vuln Commander</p>
      <h1>Sign in</h1>
      <p class="login-subtitle">Use your Vuln Commander account email and password.</p>

      {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}

      <form class="login-form" method="post" action="/api/v1/auth/login">
        <input type="hidden" name="redirect_page" value="{{ redirect_page }}" />

        <label>
          Email
          <input
            type="email"
            name="email"
            autocomplete="username"
            required
            {% if email %}value="{{ email }}"{% endif %}
          />
        </label>

        <label>
          Password
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </label>

        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
