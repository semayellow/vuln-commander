<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Vuln Commander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/lunaris.css') }}" />
</head>
<body class="lunaris-app lunaris-app--login">
  <div class="login-page">
    <div class="honeycomb-layer honeycomb-layer--fullscreen" aria-hidden="true"></div>

    <section class="login-card">
      <div class="login-card__brand">
        <span class="sidebar__logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 2L2 8v8c0 5.5 4.1 10.6 14 12 9.9-1.4 14-6.5 14-12V8L16 2Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="login-card__brand-name">Vuln Commander</span>
      </div>

      <header class="login-card__header">
        <h1>Sign in</h1>
        <p>Use your Vuln Commander account email and password.</p>
      </header>

      {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}

      <form class="login-form" method="post" action="/api/v1/auth/login">
        <input type="hidden" name="redirect_page" value="{{ redirect_page }}" />

        <label class="field">
          <span class="field__label">Email</span>
          <input
            class="field__input"
            type="email"
            name="email"
            autocomplete="username"
            placeholder="you@company.com"
            required
            {% if email %}value="{{ email }}"{% endif %}
          />
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <input
            class="field__input"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </label>

        <button type="submit" class="btn btn--primary btn--block">Sign in</button>
      </form>
    </section>
  </div>

  <script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
